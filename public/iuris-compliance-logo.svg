<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <rect width="520" height="340" fill="#FFFFFF"/>

  <!--
    ═══════════════════════════════════════════════════════════
    C ARC  — navy #0A1929
    Filled shape: outer arc (rx=105,ry=95) + inner arc (rx=79,ry=70)
    Both arcs share the same tapered tip points so the shape
    pinches to a point at the terminals, thick at the apex.

    Arc center: 274, 121
    Tip top:    349.4, 73.7   (35° above horizontal)
    Tip bottom: 349.4, 168.3  (35° below horizontal)
    Outer apex: 169, 121      (leftmost point, stroke width = 26px)
    Inner apex: 195, 121

    SVG arc: A rx ry x-rotation large-arc-flag sweep-flag x y
      sweep=1 → clockwise
      sweep=0 → counter-clockwise
    ═══════════════════════════════════════════════════════════
  -->
  <path
    d="
      M 349.4,73.7
      A 105,95  0  1  0  349.4,168.3
      A 79,70   0  1  1  349.4,73.7
      Z
    "
    fill="#0A1929"
  />

  <!--
    ═══════════════════════════════════════════════════════════
    I LETTERFORM — gold #B8860B
    Classical capital serif I
    Positioned slightly left-of-center so C visually overlaps
    the right half of the I stem, creating interplay.
    I center x=258, y range 40→210
    ═══════════════════════════════════════════════════════════
  -->

  <!-- Top slab serif — wide bar -->
  <rect x="232" y="40" width="52" height="11" rx="2" fill="#B8860B"/>
  <!-- Top serif — thin extended wings -->
  <rect x="225" y="40" width="66" height="5" rx="1" fill="#B8860B"/>

  <!-- Vertical stroke — slightly wider at mid for optical weight -->
  <polygon
    points="244,51  270,51  272,128  272,134  270,200  244,200  246,134  246,128"
    fill="#B8860B"
  />

  <!-- Bottom serif — thin extended wings -->
  <rect x="225" y="205" width="66" height="5" rx="1" fill="#B8860B"/>
  <!-- Bottom slab serif — wide bar -->
  <rect x="232" y="199" width="52" height="11" rx="2" fill="#B8860B"/>

  <!--
    ═══════════════════════════════════════════════════════════
    Thin gold rule beneath monogram
    ═══════════════════════════════════════════════════════════
  -->
  <rect x="150" y="224" width="220" height="1.5" fill="#B8860B"/>

  <!--
    ═══════════════════════════════════════════════════════════
    WORDMARK — "IURIS COMPLIANCE"
    ═══════════════════════════════════════════════════════════
  -->
  <text
    x="260"
    y="265"
    text-anchor="middle"
    font-family="'Trajan Pro', 'Cinzel', 'Cormorant Garamond', Georgia, serif"
    font-size="40"
    font-weight="700"
    letter-spacing="7"
    fill="#B8860B"
  >IURIS</text>

  <text
    x="260"
    y="294"
    text-anchor="middle"
    font-family="'Trajan Pro', 'Cinzel', 'Cormorant Garamond', Georgia, serif"
    font-size="27"
    font-weight="400"
    letter-spacing="5"
    fill="#0A1929"
  >COMPLIANCE</text>

  <!--
    ═══════════════════════════════════════════════════════════
    Decorative divider — line ◆ line
    ═══════════════════════════════════════════════════════════
  -->
  <!-- Left line -->
  <rect x="88"  y="307" width="152" height="1.5" fill="#B8860B"/>
  <!-- Right line -->
  <rect x="280" y="307" width="152" height="1.5" fill="#B8860B"/>
  <!-- Diamond ornament (rotated square) centered at 260,307 -->
  <rect
    x="252" y="299"
    width="16" height="16"
    fill="#B8860B"
    transform="rotate(45 260 307)"
  />

  <!--
    ═══════════════════════════════════════════════════════════
    Descriptor
    ═══════════════════════════════════════════════════════════
  -->
  <text
    x="260"
    y="330"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10.5"
    font-weight="400"
    letter-spacing="3.8"
    fill="#0A1929"
  >AML COMPLIANCE MANAGEMENT SYSTEM</text>

</svg>
