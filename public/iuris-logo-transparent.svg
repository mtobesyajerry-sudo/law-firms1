<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>

    <!-- Gold vertical gradient (for I stem and serifs) -->
    <linearGradient id="gGoldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF5B0"/>
      <stop offset="12%"  stop-color="#E8C84A"/>
      <stop offset="30%"  stop-color="#B8860B"/>
      <stop offset="48%"  stop-color="#F0D060"/>
      <stop offset="65%"  stop-color="#C9971A"/>
      <stop offset="82%"  stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>

    <!-- Gold horizontal gradient (for serifs) -->
    <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A5200"/>
      <stop offset="15%"  stop-color="#DAA520"/>
      <stop offset="35%"  stop-color="#FFF5B0"/>
      <stop offset="55%"  stop-color="#E8C84A"/>
      <stop offset="75%"  stop-color="#B8860B"/>
      <stop offset="90%"  stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#9A6800"/>
    </linearGradient>

    <!-- Silver gradient for C arc body -->
    <linearGradient id="gSilverArc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="10%"  stop-color="#D8D8D8"/>
      <stop offset="28%"  stop-color="#F5F5F5"/>
      <stop offset="45%"  stop-color="#B0B0B0"/>
      <stop offset="60%"  stop-color="#E8E8E8"/>
      <stop offset="78%"  stop-color="#989898"/>
      <stop offset="92%"  stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>

    <!-- Silver edge/stroke gradient -->
    <linearGradient id="gSilverEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#888888"/>
      <stop offset="40%"  stop-color="#DDDDDD"/>
      <stop offset="70%"  stop-color="#AAAAAA"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>

    <!-- Gold text gradient -->
    <linearGradient id="gGoldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="20%"  stop-color="#E8C030"/>
      <stop offset="45%"  stop-color="#9A6800"/>
      <stop offset="65%"  stop-color="#D4A820"/>
      <stop offset="85%"  stop-color="#C09010"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>

    <!-- Silver text gradient -->
    <linearGradient id="gSilverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EBEBEB"/>
      <stop offset="25%"  stop-color="#ACACAC"/>
      <stop offset="50%"  stop-color="#E0E0E0"/>
      <stop offset="75%"  stop-color="#989898"/>
      <stop offset="100%" stop-color="#686868"/>
    </linearGradient>

    <!-- Gold rule gradient -->
    <linearGradient id="gRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(160,110,0,0)"/>
      <stop offset="15%"  stop-color="#C8A020"/>
      <stop offset="50%"  stop-color="#E8D060"/>
      <stop offset="85%"  stop-color="#C8A020"/>
      <stop offset="100%" stop-color="rgba(160,110,0,0)"/>
    </linearGradient>

    <!-- Drop shadow for monogram -->
    <filter id="fShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.35)"/>
    </filter>

    <!-- Subtle glow for gold I -->
    <filter id="fGoldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- =====================================================
       MONOGRAM — centred at x=300, y spans ~15 to 270
       Silver C behind, Gold I in front
       ===================================================== -->

  <g filter="url(#fShadow)">

    <!--
      SILVER C ARC
      A thick open crescent. Think of it as a donut sector.

      Centre: cx=300, cy=148
      Outer radius R=115, inner radius r=76
      The C opens to the right. Tips angle ≈ 40° from horizontal.

      Outer arc top tip:  300 + 115·cos40 = 300+88 = 388,  148 - 115·sin40 = 148-74 = 74
      Outer arc bot tip:  388,  148+74 = 222
      Inner arc top tip:  300 + 76·cos40 = 300+58 = 358,   148 - 76·sin40 = 148-49 = 99
      Inner arc bot tip:  358,  148+49 = 197
    -->
    <path
      d="M 388,74
         A 115,115 0 1 0 388,222
         L 358,197
         A 76,76   0 1 1 358,99
         Z"
      fill="url(#gSilverArc)"
      stroke="url(#gSilverEdge)"
      stroke-width="1.2"
    />

  </g>

  <!-- GOLD SERIF I
       Tall classical capital I.
       Total height: y=18 to y=275 (257px tall)
       Stem width: 54px centred at x=295 (x=268 to x=322)

       Top serif:    wide slab,  y=18  h=22  centred
       Neck top:     narrow band y=40  h=14
       Stem:         y=54  to y=240
       Neck bot:     narrow band y=240 h=14
       Bot serif:    wide slab,  y=254 h=22

       Serif width: 120px (x=235 to x=355)
       Stem width:  54px  (x=268 to x=322)
  -->
  <g filter="url(#fGoldGlow)">

    <!-- TOP SERIF SLAB — outermost wide bar -->
    <rect x="232" y="18"  width="126" height="12" rx="2" fill="url(#gGoldH)"/>
    <!-- TOP SERIF main block -->
    <rect x="242" y="28"  width="106" height="16" rx="2" fill="url(#gGoldH)" stroke="rgba(100,60,0,0.4)" stroke-width="0.5"/>

    <!-- NECK top — tapers from serif to stem -->
    <polygon points="268,44 322,44 316,58 274,58" fill="url(#gGoldV)"/>

    <!-- MAIN STEM -->
    <rect x="268" y="56"  width="54"  height="188" fill="url(#gGoldV)" stroke="rgba(80,40,0,0.3)" stroke-width="0.5"/>

    <!-- Bevel highlight on left of stem -->
    <rect x="268" y="56"  width="10"  height="188" fill="rgba(255,240,150,0.30)" rx="1"/>
    <!-- Bevel shadow on right of stem -->
    <rect x="312" y="56"  width="10"  height="188" fill="rgba(60,20,0,0.20)"     rx="1"/>

    <!-- NECK bottom — tapers from stem back out to serif -->
    <polygon points="274,244 316,244 322,258 268,258" fill="url(#gGoldV)"/>

    <!-- BOT SERIF main block -->
    <rect x="242" y="256" width="106" height="16" rx="2" fill="url(#gGoldH)" stroke="rgba(100,60,0,0.4)" stroke-width="0.5"/>
    <!-- BOT SERIF outermost wide bar -->
    <rect x="232" y="270" width="126" height="12" rx="2" fill="url(#gGoldH)"/>

  </g>

  <!-- =====================================================
       WORDMARK — "IURIS COMPLIANCE"
       Using two <text> elements, gold over silver trick:
       First render full text in silver, then overlay first
       char of each word in gold.
       Font: large serif caps

       Baseline y=345, centred at x=300
       ===================================================== -->

  <!-- Full wordmark in silver -->
  <text
    x="300" y="345"
    text-anchor="middle"
    font-family="'Cinzel','Trajan Pro','EB Garamond','Times New Roman',serif"
    font-size="56"
    font-weight="700"
    letter-spacing="1"
    fill="url(#gSilverText)"
  >Iuris Compliance</text>

  <!-- Gold overlay on "I" — first char of "Iuris" -->
  <!-- Cinzel: at font-size 56, "I" is narrow ~18px. Left edge of full text:
       300 - (half of "Iuris Compliance" width ~386px / 2) ≈ 300-193 = 107 -->
  <text
    x="107" y="345"
    text-anchor="start"
    font-family="'Cinzel','Trajan Pro','EB Garamond','Times New Roman',serif"
    font-size="56"
    font-weight="700"
    fill="url(#gGoldText)"
  >I</text>

  <!-- Gold overlay on "C" — first char of "Compliance"
       "Iuris " in Cinzel at size 56 with letter-spacing 1 ≈ 172px wide
       so "C" starts at x ≈ 107 + 172 = 279 -->
  <text
    x="284" y="345"
    text-anchor="start"
    font-family="'Cinzel','Trajan Pro','EB Garamond','Times New Roman',serif"
    font-size="56"
    font-weight="700"
    fill="url(#gGoldText)"
  >C</text>

  <!-- =====================================================
       GOLD RULE + DIAMOND
       y=365
       ===================================================== -->

  <!-- Left rule segment -->
  <rect x="55"  y="364" width="210" height="1.5" rx="1" fill="url(#gRule)"/>
  <!-- Right rule segment -->
  <rect x="335" y="364" width="210" height="1.5" rx="1" fill="url(#gRule)"/>

  <!-- Diamond at centre -->
  <polygon
    points="300,356  309,364  300,372  291,364"
    fill="url(#gGoldText)"
    stroke="#9A7010"
    stroke-width="0.8"
  />

  <!-- =====================================================
       CAPTION
       ===================================================== -->
  <text
    x="300" y="400"
    text-anchor="middle"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="13.5"
    font-weight="400"
    letter-spacing="3"
    fill="#4A5568"
  >AML COMPLIANCE MANAGEMENT SYSTEM</text>

</svg>
