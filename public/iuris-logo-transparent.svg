<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460">
  <defs>

    <!-- ═══════════════════════════════════════════
         GOLD gradients — warm metallic, bevel effect
         ═══════════════════════════════════════════ -->
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="18%"  stop-color="#E8C84A"/>
      <stop offset="38%"  stop-color="#C9971A"/>
      <stop offset="55%"  stop-color="#F0D060"/>
      <stop offset="72%"  stop-color="#B8820A"/>
      <stop offset="88%"  stop-color="#D4AA30"/>
      <stop offset="100%" stop-color="#8A5E00"/>
    </linearGradient>

    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8A5E00"/>
      <stop offset="20%"  stop-color="#D4AA30"/>
      <stop offset="40%"  stop-color="#F0D060"/>
      <stop offset="55%"  stop-color="#FFF0A0"/>
      <stop offset="70%"  stop-color="#E8C84A"/>
      <stop offset="85%"  stop-color="#C9971A"/>
      <stop offset="100%" stop-color="#9A6E05"/>
    </linearGradient>

    <!-- Gold stroke for letterform outlines -->
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9A020"/>
      <stop offset="50%"  stop-color="#705000"/>
      <stop offset="100%" stop-color="#C9A020"/>
    </linearGradient>

    <!-- ═══════════════════════════════════════════
         SILVER gradients — for C arc
         ═══════════════════════════════════════════ -->
    <linearGradient id="silverArc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#E8E8E8"/>
      <stop offset="15%"  stop-color="#C0C0C0"/>
      <stop offset="35%"  stop-color="#F8F8F8"/>
      <stop offset="50%"  stop-color="#D0D0D0"/>
      <stop offset="65%"  stop-color="#A8A8A8"/>
      <stop offset="80%"  stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>

    <linearGradient id="silverEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#707070"/>
      <stop offset="30%"  stop-color="#C8C8C8"/>
      <stop offset="60%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>

    <!-- Drop shadow filter for monogram -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>

    <!-- Subtle inner glow on gold I -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gold wordmark gradient — horizontal -->
    <linearGradient id="goldWord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="25%"  stop-color="#D4AA30"/>
      <stop offset="50%"  stop-color="#A07010"/>
      <stop offset="75%"  stop-color="#D4AA30"/>
      <stop offset="100%" stop-color="#8A5E00"/>
    </linearGradient>

    <!-- Silver wordmark gradient -->
    <linearGradient id="silverWord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8E8E8"/>
      <stop offset="30%"  stop-color="#B0B0B0"/>
      <stop offset="55%"  stop-color="#F0F0F0"/>
      <stop offset="80%"  stop-color="#A0A0A0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>

    <!-- Gold rule gradient -->
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(180,130,0,0)"/>
      <stop offset="20%"  stop-color="#C9A020"/>
      <stop offset="50%"  stop-color="#F0D060"/>
      <stop offset="80%"  stop-color="#C9A020"/>
      <stop offset="100%" stop-color="rgba(180,130,0,0)"/>
    </linearGradient>

  </defs>

  <!-- ═══════════════════════════════════════════════════
       MONOGRAM — centred at x=280, top area
       C arc (silver) behind, I letterform (gold) in front
       ═══════════════════════════════════════════════════ -->

  <g filter="url(#shadow)">

    <!-- ── SILVER C ARC ──
         Thick crescent path:
         Outer arc: cx=280 cy=148 rx=118 ry=118
         Inner arc: cx=280 cy=148 rx=82  ry=82
         Open on right side (tips point right ~30° from horizontal)

         Outer tip top:    280+118·cos30=280+102=382,  148−118·sin30=148−59=89
         Outer tip bot:    382, 148+59=207
         Inner tip top:    280+82·cos30=280+71=351,    148−82·sin30=148−41=107
         Inner tip bot:    351, 148+41=189
         Outer left apex:  280-118=162, 148
         Inner left apex:  280-82=198,  148
    -->
    <path
      d="M 382,89
         A 118,118 0 1 0 382,207
         L 351,189
         A 82,82   0 1 1 351,107
         Z"
      fill="url(#silverArc)"
      stroke="url(#silverEdge)"
      stroke-width="1.5"
    />

  </g>

  <!-- ── GOLD SERIF I ──
       Classical capital I with thick slab serifs and tapered stem.
       Centred at x=277, vertical span y=30 → y=268.
       The stem is deliberately wide and bold to match the 3D rendered look.
  -->
  <g filter="url(#shadow)">

    <!-- Top cap serif (wide slab) -->
    <rect x="224" y="30"  width="106" height="28" rx="3" fill="url(#goldH)" stroke="url(#goldStroke)" stroke-width="1"/>
    <!-- Top cap serif thin wings extending further -->
    <rect x="210" y="30"  width="134" height="14" rx="2" fill="url(#goldH)" stroke="url(#goldStroke)" stroke-width="0.5"/>

    <!-- Upper stem band (joins cap to main stem) -->
    <rect x="240" y="55"  width="74"  height="18" rx="1" fill="url(#goldV)"/>

    <!-- Main stem — trapezoid, wider at mid for 3D look -->
    <polygon
      points="247,73  311,73  316,148  316,162  311,268  247,268  252,162  252,148"
      fill="url(#goldV)"
      stroke="url(#goldStroke)"
      stroke-width="1"
    />

    <!-- Lower stem band -->
    <rect x="240" y="240" width="74"  height="18" rx="1" fill="url(#goldV)"/>

    <!-- Bottom cap serif (wide slab) -->
    <rect x="210" y="254" width="134" height="14" rx="2" fill="url(#goldH)" stroke="url(#goldStroke)" stroke-width="0.5"/>
    <rect x="224" y="240" width="106" height="28" rx="3" fill="url(#goldH)" stroke="url(#goldStroke)" stroke-width="1"/>

    <!-- Highlight strip on left face of I (bevel) -->
    <rect x="247" y="73"  width="8"   height="195" rx="2" fill="rgba(255,240,140,0.45)"/>
    <!-- Shadow strip on right face -->
    <rect x="303" y="73"  width="8"   height="195" rx="2" fill="rgba(80,40,0,0.25)"/>

  </g>

  <!-- ═══════════════════════════════════════════════════
       WORDMARK — "Iuris Compliance"
       "I" in gold, rest of "uris" in silver,
       space, "C" in gold, "ompliance" in silver
       Uses two <text> blocks with tspan for color switching
       ═══════════════════════════════════════════════════ -->

  <!-- Wordmark outer text — silver fill (base layer) -->
  <text
    x="280" y="336"
    text-anchor="middle"
    font-family="'Trajan Pro','Cinzel','Cormorant SC','EB Garamond SC',Georgia,serif"
    font-size="58"
    font-weight="700"
    letter-spacing="2"
    fill="url(#silverWord)"
    stroke="rgba(80,60,0,0.3)"
    stroke-width="0.5"
  >Iuris Compliance</text>

  <!-- Overlay: gold tints on first letters of each word for the mixed look -->
  <!-- "I" (first char) -->
  <text
    x="51" y="336"
    text-anchor="start"
    font-family="'Trajan Pro','Cinzel','Cormorant SC','EB Garamond SC',Georgia,serif"
    font-size="58"
    font-weight="700"
    fill="url(#goldWord)"
    stroke="rgba(80,40,0,0.3)"
    stroke-width="0.5"
  >I</text>
  <!-- "C" of Compliance — positioned by measuring roughly -->
  <text
    x="311" y="336"
    text-anchor="start"
    font-family="'Trajan Pro','Cinzel','Cormorant SC','EB Garamond SC',Georgia,serif"
    font-size="58"
    font-weight="700"
    fill="url(#goldWord)"
    stroke="rgba(80,40,0,0.3)"
    stroke-width="0.5"
  >C</text>

  <!-- ═══════════════════════════════════════════════════
       GOLD RULE — thin horizontal line with diamond centre
       ═══════════════════════════════════════════════════ -->

  <!-- Left rule -->
  <rect x="60"  y="358" width="195" height="1.5" fill="url(#goldRule)" rx="1"/>
  <!-- Right rule -->
  <rect x="305" y="358" width="195" height="1.5" fill="url(#goldRule)" rx="1"/>

  <!-- Diamond gem at centre -->
  <polygon
    points="280,350  288,358  280,366  272,358"
    fill="url(#goldWord)"
    stroke="#A07010"
    stroke-width="1"
  />

  <!-- ═══════════════════════════════════════════════════
       CAPTION — "AML COMPLIANCE MANAGEMENT SYSTEM"
       Spaced small caps in dark slate
       ═══════════════════════════════════════════════════ -->
  <text
    x="280" y="400"
    text-anchor="middle"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="15"
    font-weight="500"
    letter-spacing="3.5"
    fill="#4A5568"
  >AML COMPLIANCE MANAGEMENT SYSTEM</text>

</svg>
