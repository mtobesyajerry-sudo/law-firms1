<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" width="480" height="410">
  <!--
    Iuris Compliance — transparent background
    Matches the uploaded logo composition:
      1. IC monogram (navy I serif + gold gradient C arc, overlapping)
      2. "Iuris Compliance" large serif wordmark in navy
      3. "AML/CFT Compliance Management System" small caption in navy
    No background fill — fully transparent.
  -->
  <defs>
    <!-- Gold gradient: warm antique gold, darker at edges, bright highlight at center -->
    <linearGradient id="goldArc" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#A07820"/>
      <stop offset="25%"  stop-color="#D4AA45"/>
      <stop offset="50%"  stop-color="#F0DC90"/>
      <stop offset="75%"  stop-color="#C49030"/>
      <stop offset="100%" stop-color="#7A5510"/>
    </linearGradient>

    <!-- Slightly cooler gold for the inner C face to give depth -->
    <linearGradient id="goldInner" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#BF9428"/>
      <stop offset="50%"  stop-color="#E8CE70"/>
      <stop offset="100%" stop-color="#8C6015"/>
    </linearGradient>
  </defs>

  <!--
    ══════════════════════════════════════════
    C ARC — gold gradient
    Filled region between two concentric ellipses,
    pinched to a sharp tip at both open ends.

    Arc center:  cx=242, cy=148
    Outer ellipse: rx=118, ry=110
    Inner ellipse: rx=86,  ry=80

    Open angle from horizontal: 28°

    Outer tip top:    x=242+118·cos28=242+104.2=346.2,  y=148−110·sin28=148−51.6=96.4
    Outer tip bottom: x=346.2,                            y=148+51.6=199.6
    Inner tip top:    x=242+86·cos28 =242+75.9=317.9,   y=148−80·sin28 =148−37.6=110.4
    Inner tip bottom: x=317.9,                            y=148+37.6=185.6
    Shared tip top:    avg → (332.1, 103.4)
    Shared tip bottom: avg → (332.1, 192.6)
    Outer apex (180°): 242−118=124, 148
    Inner apex (180°): 242−86=156,  148
    ══════════════════════════════════════════
  -->
  <path
    d="M 332.1,103.4
       A 118,110  0  1  0  332.1,192.6
       A 86,80    0  1  1  332.1,103.4
       Z"
    fill="url(#goldArc)"
  />

  <!--
    ══════════════════════════════════════════
    I LETTERFORM — deep navy #0D2340
    Classical capital serif I
    Center x=228, vertical span y=42 → y=258
    Slab serifs top & bottom, slight stem taper for optical weight
    ══════════════════════════════════════════
  -->

  <!-- Top serif — thin extended wings -->
  <rect x="178" y="42"  width="100" height="7"  rx="1.5" fill="#0D2340"/>
  <!-- Top slab (thick block) -->
  <rect x="190" y="42"  width="76"  height="21" rx="2"   fill="#0D2340"/>

  <!-- Vertical stem — trapezoid: wider at mid for optical weight -->
  <polygon
    points="204,63  252,63  255,148  255,158  252,258  204,258  207,158  207,148"
    fill="#0D2340"
  />

  <!-- Bottom slab -->
  <rect x="190" y="237" width="76"  height="21" rx="2"   fill="#0D2340"/>
  <!-- Bottom serif wings -->
  <rect x="178" y="251" width="100" height="7"  rx="1.5" fill="#0D2340"/>

  <!--
    ══════════════════════════════════════════
    WORDMARK: "Iuris Compliance"
    Large classical serif, navy, single line
    ══════════════════════════════════════════
  -->
  <text
    x="240"
    y="316"
    text-anchor="middle"
    font-family="'Trajan Pro', 'Cinzel', 'Cormorant Garamond', 'EB Garamond', Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="400"
    letter-spacing="1"
    fill="#0D2340"
  >Iuris Compliance</text>

  <!--
    ══════════════════════════════════════════
    DESCRIPTOR: caption line
    ══════════════════════════════════════════
  -->
  <text
    x="240"
    y="354"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="15.5"
    font-weight="400"
    letter-spacing="0.6"
    fill="#0D2340"
  >AML/CFT Compliance Management System</text>

</svg>
