<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Law Firm AML Compliance System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading-fallback {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      gap: 20px;
    }
    .loading-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner-container {
      position: relative;
      width: 50px;
      height: 50px;
    }
    .spinner-outer {
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    .spinner-inner {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 35px;
      height: 35px;
      animation: spinReverse 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .loading-text {
      color: #3b82f6;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-fallback">
      <div class="loading-content">
        <div class="spinner-container">
          <svg class="spinner-outer" viewBox="0 0 50 50">
            <circle
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke="#3b82f6"
              stroke-width="3"
              stroke-dasharray="31.4 31.4"
              stroke-linecap="round"
              opacity="0.8"
            />
          </svg>
          <svg class="spinner-inner" viewBox="0 0 50 50">
            <circle
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke="#3b82f6"
              stroke-width="3"
              stroke-dasharray="20 20"
              stroke-linecap="round"
              opacity="0.5"
            />
          </svg>
        </div>
        <div class="loading-text">Loading application...</div>
      </div>
    </div>
  </div>
  <script>
    console.log('=== HTML Loaded ===');
    console.log('Root element exists:', !!document.getElementById('root'));
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.error);
      document.body.innerHTML = '<div style="padding:40px;background:#fee;color:#c00;font-family:monospace;"><h1>Error Loading Application</h1><pre>' + e.error + '</pre></div>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
