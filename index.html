<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Law Firm AML Compliance System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    #root {
      min-height: 100vh;
    }
    .loading-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f7fafc;
    }
    .loading-content {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-fallback">
      <div class="loading-content">
        <div class="spinner"></div>
        <p style="color: #4a5568; font-size: 16px;">Loading Application...</p>
      </div>
    </div>
  </div>
  <script>
    console.log('=== HTML Loaded ===');
    console.log('Root element exists:', !!document.getElementById('root'));
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.error);
      document.body.innerHTML = '<div style="padding:40px;background:#fee;color:#c00;font-family:monospace;"><h1>Error Loading Application</h1><pre>' + e.error + '</pre></div>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
